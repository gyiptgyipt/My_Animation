[CLI]
# Frame rate for rendering
frame_rate = 60

# Quality settings for smooth playback
pixel_height = 1080
pixel_width = 1920

# OpenGL renderer for better performance
renderer = opengl

# Background color
background_color = #000000

# Output format
write_to_movie = True
movie_file_extension = .mp4

# Preview settings
preview = True
show_in_file_browser = False
